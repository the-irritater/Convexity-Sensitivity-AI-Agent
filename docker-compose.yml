# ============================================================
# Convexity Sensitivity AI Agent — Docker Compose
# ============================================================

version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: convexity-agent
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Run all analytics parts (one-shot)
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: convexity-analytics
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    environment:
      - PYTHONPATH=/app
    command: ["python3", "convexity_agent_complete.py"]
    profiles:
      - analytics
